name: Build installers

on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"
      - id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.read.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: [version, test]
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name PyTrader
          --paths src
          --add-data "version.txt:."
          --add-data "styles.qss:."
          src/main.py
      - name: Installer Windows (NSIS)
        if: runner.os == 'Windows'
        run: makensis /DVERSION=${{ env.VERSION }} installer\pytrader.nsi
      - name: Archivio Linux
        if: runner.os == 'Linux'
        run: tar -czf dist/PyTrader-${VERSION}-linux.tar.gz -C dist PyTrader
      - name: Archivio macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PyTrader.app dist/PyTrader-${VERSION}-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pytrader-${{ matrix.os }}
          path: |
            dist/*-setup.exe
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: PyTrader ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
